[project]
name = "ai-healthcare-etl-platform"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Vivek Jori", email = "vivek.jori@nitorinfotech.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.110",
    "fhir-resources>=8.0",
    "httpx>=0.27",
    "pydantic>=2.6",
    "pytest>=8.0",
    "python-dotenv>=1.0",
    "truststore>=0.10",
    "uvicorn>=0.29",
]

[project.scripts]
ai-healthcare-etl-platform = "ai_healthcare_etl_platform:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"
